# .archon/factory-profile.yaml — written by the Archon `factory` workflow.
# Edit freely. While this file exists the workflow never asks these questions again.
# `secrets` lists environment-variable NAMES only; values stay on the machine that runs Archon.
version: 1
stack:
  language: "Shell"
  framework: ""
  test_command: "bash scripts/ci/check.sh"
  lint_command: "bash scripts/ci/check.sh actionlint"
  build_command: ""
  # check.sh outgrew the default 1000 s under parallel factory load (PILOT-375). Measured 2026-10-28,
  # each check of check.sh in turn next to other check.sh runs (load 3.3-7.5): 1296 s in all, of which
  # archon (tools.sh archon + archon-check.sh) 745 s, tests 231 s, mvp_sdlc 192 s, factory 56 s.
  test_timeout_seconds: 2400
repo:
  remote: "origin"
  base_branch: "develop"
  merge_strategy: "squash"
  # Factory PRs go into develop and are merged by the factory. A PR whose base is listed here
  # (the release develop -> main, a hotfix into main) is never merged by the factory: it comments
  # for the operator (decisions 27, 54).
  manual_merge_bases: ["main"]
deploy:
  command: "echo \"1_mvp_sdlc: no deploy target (toolkit repository; workflows are installed with install.sh)\""
  health_url: "http://mvp.up.km.ua/health"
  wait_seconds: 120
  rollback_command: "echo \"1_mvp_sdlc: no rollback target (no deploy configured)\""
monitoring:
  provider: "none"
  mcp_config: ""
  window_minutes: 10
secrets: []
