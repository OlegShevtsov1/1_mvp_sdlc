name: Kamal Manage
# bin/sdlc-metrics counts the successful rollback runs by this title.
run-name: Kamal Manage ${{ inputs.action }}

# Operates the prod deployment through the shared mvp VPN: status, logs, restart, rollback
# (deploy/rollback.sh prod, which also moves the ECR tags prod-current/prod-previous) and remove.
# See README "Prod deploy".
#
# Dual control: runs only from main; restart needs confirm=prod, rollback the typed
# confirm=ROLLBACK-prod (deploy/rollback.sh checks it again), remove needs confirm=remove-prod and a
# passed backup gate.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with prod
        required: true
        type: choice
        options: [status, logs, restart, rollback, remove]
      version:
        description: Rollback target (40-hex git sha, optionally sha-<sha>); empty rolls back to the version before the current one
        required: false
        default: ''
        type: string
      confirm:
        description: prod for restart, ROLLBACK-prod for rollback, remove-prod for remove; not needed for status and logs
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Shared with Kamal Deploy: two prod operations never overlap.
concurrency:
  group: kamal-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  guard:
    name: Guard (ref, action, confirm)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the ref and the inputs
        id: inputs
        env:
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
        run: deploy/prod_guard.sh manage >> "${GITHUB_OUTPUT}"

  # Only names are checked and printed, never values.
  preflight:
    name: Preflight (secrets)
    needs: guard
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Check that every required secret is set
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          VPN_CI_OVPN: ${{ secrets.VPN_CI_OVPN }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ALLOWED_FE_DSN: ${{ secrets.SENTRY_ALLOWED_FE_DSN }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          TELEGRAM_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PROD_ALERTS_THREAD_ID }}
        run: |
          source deploy/_common.sh
          # PROJECT_NAME comes from config/project.env and KAMAL_REGISTRY_PASSWORD from the ECR
          # login inside deploy.sh; every other variable .kamal/secrets.prod reads is a secret.
          mapfile -t kamal_secrets < <(secret_names .kamal/secrets.prod | grep -vxE 'PROJECT_NAME|KAMAL_REGISTRY_PASSWORD')
          required=(
            AWS_ROLE_ARN VPN_CI_OVPN PROD_SSH_KEY PROD_VPN_IP
            "${kamal_secrets[@]}"
            TELEGRAM_PROD_ALERTS_BOT_TOKEN TELEGRAM_PROD_ALERTS_CHAT_ID TELEGRAM_PROD_ALERTS_THREAD_ID
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${GITHUB_WORKFLOW} cannot start, missing secrets: ${missing[*]} (see README \"Prod deploy\")"
            exit 1
          fi
          echo "all required secrets are set: ${required[*]}"

  # A uses: that cannot be resolved kills its job at "Set up job", before any step can explain
  # why, so the shared actions are resolved here, in a job that touches nothing.
  # vpn-down without vpn-up only prints "nothing to clean up".
  probe:
    name: Probe (shared VPN actions)
    needs: preflight
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Resolve the shared actions from 1_mvp_infra@env/dev
        uses: OlegShevtsov1/1_mvp_infra/.github/actions/vpn-down@env/dev

      - name: Check that vpn-up exists next to vpn-down
        run: |
          actions_dir="$(dirname "${RUNNER_WORKSPACE}")/_actions/OlegShevtsov1/1_mvp_infra"
          if [[ -z "$(find "${actions_dir}" -path '*/.github/actions/vpn-up/action.yml' 2>/dev/null)" ]]; then
            echo "::error::vpn-up is missing on OlegShevtsov1/1_mvp_infra@env/dev (I4a not merged)"
            exit 1
          fi
          echo "vpn-up and vpn-down are available"

  # remove deletes the prod database volume, so it only runs after a checked backup. Until the
  # backup gate (I5) exists this job always fails, and remove stays disabled.
  backup-gate:
    name: Backup gate (prod DB)
    needs: probe
    if: inputs.action == 'remove'
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      passed: ${{ steps.backup.outputs.passed }}
    steps:
      - name: Back up the prod database
        id: backup
        run: |
          echo "::error::remove is disabled until the prod DB backup gate (I5, in 1_mvp_infra) exists; nothing was removed"
          exit 1

  manage:
    name: Manage (VPN + Kamal)
    needs: [guard, probe, backup-gate]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.probe.result == 'success' && (needs.backup-gate.result == 'success' || needs.backup-gate.result == 'skipped') }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Before vpn-up: everything slow happens outside the VPN lock window.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install crane
        env:
          CRANE_VERSION: 0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${RUNNER_TEMP}/crane.tgz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/crane.tgz" -C "${RUNNER_TEMP}/bin" crane
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load the prod SSH key into an agent (never written to disk)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          eval "$(ssh-agent -a "${RUNNER_TEMP}/ssh-agent.sock")" > /dev/null
          ssh-add - <<< "${PROD_SSH_KEY}"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: VPN up
        uses: OlegShevtsov1/1_mvp_infra/.github/actions/vpn-up@env/dev
        with:
          ovpn: ${{ secrets.VPN_CI_OVPN }}

      - name: Check that prod is reachable over the VPN
        env:
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
        run: |
          for attempt in 1 2 3; do
            if nc -z -w 5 "${PROD_VPN_IP}" 22; then
              echo "prod SSH is reachable over the VPN"
              exit 0
            fi
            echo "attempt ${attempt}: prod SSH not reachable yet"
            sleep 5
          done
          echo "::error::prod SSH is not reachable over the VPN"
          exit 1

      - name: Run the action
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ needs.guard.outputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          BACKUP_GATE: ${{ needs.backup-gate.outputs.passed }}
          PROD_VPN_IP: ${{ secrets.PROD_VPN_IP }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ALLOWED_FE_DSN: ${{ secrets.SENTRY_ALLOWED_FE_DSN }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          if [[ "${ACTION}" == 'rollback' ]]; then
            deploy/rollback.sh prod "${VERSION}"
          else
            deploy/manage.sh "${ACTION}"
          fi

      - name: VPN down
        if: always()
        uses: OlegShevtsov1/1_mvp_infra/.github/actions/vpn-down@env/dev

  report:
    name: Report
    needs: [guard, preflight, probe, backup-gate, manage]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      message: ${{ steps.summarize.outputs.message }}
    steps:
      - name: Summarize the job results
        id: summarize
        env:
          ACTION: ${{ inputs.action }}
          GUARD: ${{ needs.guard.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          PROBE: ${{ needs.probe.result }}
          BACKUP_GATE: ${{ needs.backup-gate.result }}
          MANAGE: ${{ needs.manage.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          explain() {
            case "$1" in
              guard) echo 'refused: workflow ref is not main, or the action/confirm/version is invalid; nothing touched prod' ;;
              preflight) echo 'required secrets are missing: see the preflight error for their names and README "Prod deploy"' ;;
              probe) echo "actions from OlegShevtsov1/1_mvp_infra@env/dev unavailable: I4a not merged to env/dev, or 1_mvp_infra Actions access is not 'user'" ;;
              backup-gate) echo 'remove is disabled until the prod DB backup gate (I5) exists; nothing was removed' ;;
              manage) echo 'the VPN, Kamal or the health check failed: see the manage log' ;;
            esac
          }
          jobs=(guard preflight probe backup-gate manage)
          results=("${GUARD}" "${PREFLIGHT}" "${PROBE}" "${BACKUP_GATE}" "${MANAGE}")
          {
            echo '| job | result |'
            echo '| --- | --- |'
            for i in "${!jobs[@]}"; do
              echo "| ${jobs[i]} | ${results[i]} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
          failed=''
          for i in "${!jobs[@]}"; do
            if [[ "${results[i]}" == 'failure' || "${results[i]}" == 'cancelled' ]]; then
              failed="${jobs[i]}"
              break
            fi
          done
          if [[ -n "${failed}" ]]; then
            message="❌ Kamal Manage prod ${ACTION} failed in ${failed}: $(explain "${failed}") ${RUN_URL}"
            echo "::error::${failed} failed: $(explain "${failed}")"
          else
            message="✅ Kamal Manage prod ${ACTION} succeeded ${RUN_URL}"
          fi
          echo "message=${message}" >> "${GITHUB_OUTPUT}"
          echo "FAILED_JOB=${failed}" >> "${GITHUB_ENV}"

      - name: Fail when a job failed
        if: env.FAILED_JOB != ''
        run: exit 1

  notify:
    name: Notify (Telegram)
    needs: [report]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: prod
    steps:
      - uses: OlegShevtsov1/1_mvp_infra/.github/actions/notify-telegram@env/dev
        env:
          TELEGRAM_PROD_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_PROD_ALERTS_BOT_TOKEN }}
          TELEGRAM_PROD_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_PROD_ALERTS_CHAT_ID }}
          TELEGRAM_PROD_ALERTS_THREAD_ID: ${{ secrets.TELEGRAM_PROD_ALERTS_THREAD_ID }}
        with:
          topic: PROD_ALERTS
          message: ${{ needs.report.outputs.message || format('❌ Kamal Manage could not report its result {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
