name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Actionlint, hygiene, gitleaks
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Actionlint
        run: bash scripts/ci/check.sh actionlint

      - name: Script tests
        run: bash scripts/ci/check.sh tests

      - name: Plugin lint and eval runner tests, evals layer 0 (no model calls)
        run: bash scripts/ci/check.sh plugins

      - name: mvp-sdlc plugin tests (hooks, phase gate, scripts)
        run: bash scripts/ci/check.sh mvp_sdlc

      - name: SDLC docs (links, references that exist, English only)
        run: bash scripts/ci/check.sh docs

      - name: Public-repo check (no internal hosts, IPs, IDs or local paths)
        run: bash scripts/ci/check.sh hygiene

      - name: Gitleaks (secrets, full history)
        run: bash scripts/ci/check.sh gitleaks

  orchestration:
    name: Archon workflows (v0.12.1)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Factory unit tests (bun)
        run: bash scripts/ci/check.sh factory

      - name: Archon validate and dry-run fixtures on the pinned version
        run: bash scripts/ci/check.sh archon
