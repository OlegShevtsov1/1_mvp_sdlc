# Red path: the deploy succeeded but the health check never returned 200.
# decide-rollback asks for the rollback, report marks the run not delivered and
# the not-delivered cancel node ends it. Same first-run shape as fresh-profile.
# gate-round executes for real (exec-code); write-profile and load-profile are
# stubbed because the scratch worktree has no draft and no profile file.
# Covers Archon v0.10.1 and v0.11.1: the stubs are the union of both versions'
# archon-deliver inner nodes.
profile-check: '{"exists":false}'
intake:
  summary: "stub: python/fastapi detected; deploy via docker compose over ssh (assumed)"
  assumed: [deploy.command, deploy.health_url]
  report: { type: archon_artifact, run_id: "fixture-run", path: "factory-profile.json" }
profile-write: { written: true, path: ".archon/factory-profile.yaml", commit: "0000000" }
load-profile: &profile
  language: python
  framework: fastapi
  test_command: "true"
  lint_command: ""
  build_command: ""
  remote: origin
  base_branch: develop
  merge_strategy: squash
  deploy_command: "echo deploy"
  health_url: "https://app.example.com/health"
  wait_seconds: 120
  rollback_command: "echo rollback"
  monitoring_provider: sentry
  window_minutes: 10
  secret_names: [SENTRY_AUTH_TOKEN]
  manual_merge_bases: ["main"]

# Plan loop, the bundled archon-deliver block and the merge. The deliver
# include arrives with its own `with:` values, which the simulation does not
# deliver to composed nodes, so every node inside it is stubbed.
plan__plan:
  ready: true
  summary: "stub: approach chosen and plan ready"
  report: { type: archon_artifact, run_id: "fixture-run", path: "plan.md" }
plan__assert-intact: "ok"
deliver__impl__record-start: '{"start":"recorded"}'
deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
deliver__impl__assert-changed: "2 files changed"
deliver__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":""}'
deliver__pr__pr: { intent: "stub", repo: { host: "github.com", path: "example/repo" }, number: 3, url: "https://github.com/example/repo/pull/3", head: "fixture-branch", base: "main", is_draft: true }
deliver__classify:
  errors: false
  docs: false
  reasons: { errors: "stub", docs: "stub" }
deliver__resolve-scope: '{"errors":"false"}'
deliver__review__mode: '{"continuation":false}'
deliver__review__scope: { docs: false, pr: { number: 3 } }
deliver__review__code: "0 findings"
deliver__review__seams: "0 findings"
deliver__review__simplify: "0 findings"
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
deliver__gate-ready: '{"gate":"ready"}'
deliver__validate__validate:
  green: true
  red_cause: ""
  summary: "stub: project gate green"
deliver__gate-validated: '{"gate":"green","red_cause":"","stage":"The project gate","summary":""}'
ci-probe: '{"state":"concluded","detail":"all checks green"}'
deliver__flip-ready: { pr_url: "https://github.com/example/repo/pull/3" }
deliver__outcome: { pr_url: "https://github.com/example/repo/pull/3", summary: "https://github.com/example/repo/pull/3" }
# Inner nodes that only Archon v0.11.1's archon-deliver reaches; v0.10.1 reports
# them as unused stubs.
deliver__pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 3, url: "https://github.com/example/repo/pull/3", head: "fixture-branch", base: "main", is_draft: true, state: open, head_repo: null, head_revision: null, base_revision: null, maintainer_can_modify: null }
deliver__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
deliver__validate__mode: '{"comparison":false}'
deliver__validate__discover: { checks: [{ name: "tests", argv: ["true"] }], quarantine: [], notes: "stub" }
deliver__validate__run: { status: green, summary: "stub: all green" }
deliver__validate__result: { green: true, red_cause: "", summary: "stub: project gate green", evidence: null }
deliver__ci-verdict: { state: concluded, detail: "all checks green" }
deliver__ci-attention-route: { attention: false, red_cause: "" }
# pr-state talks to GitHub, so it is stubbed; merge-gate executes for real
# against it in the scratch worktree of HEAD, where the profile's test
# command is `true`.
pr-state: { pr_url: "https://github.com/example/repo/pull/3", read: true, head: "fixture-branch", base: "develop", state: "OPEN", is_draft: false, checkout_is_head: true, checkout_clean: true, checks: [{ name: "Tests", bucket: "pass" }], checks_read: true }
merge: { merged: true, merge_sha: "abc1234", head: "fixture-branch" }

# monitor-check and monitor are skipped (health is red), so they need no stubs.
# decide-rollback and report execute for real; rollback is stubbed because it
# fires here and the scratch worktree has nothing to roll back.
deploy: { deployed: true, exit_code: 0, deployed_at: "2026-09-20T10:00:00Z", log: "deploy.log" }
health: { healthy: false, last_status: "503", elapsed_seconds: 120 }
rollback: { rolled_back: true, exit_code: 0, log: "rollback.log" }

exec-code: true
fixture:
  expect: cancelled
  inputs:
    task: "add a /health endpoint"
