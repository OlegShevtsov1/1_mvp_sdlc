version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    bundler-minor-patch:
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns: ["*"]
