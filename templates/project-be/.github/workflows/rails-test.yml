name: Rails Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'hotfix/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILS_ENV: test

jobs:
  test:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: {{PROJECT_NAME}}_test
        ports: ['5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 --verbose .

      # shellcheck is preinstalled on the runner; actionlint uses it for every run: block.
      - name: actionlint (workflows)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup DB
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/{{PROJECT_NAME}}_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/0
        run: bundle exec rails db:create db:schema:load

      - name: RSpec
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/{{PROJECT_NAME}}_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/0
        run: bundle exec rspec --format documentation

      - name: RuboCop
        run: bundle exec rubocop --format github

      - name: Brakeman (security)
        run: bundle exec brakeman --no-pager -q

      - name: Bundler Audit (vulnerable gems)
        run: bundle exec bundler-audit check --update
