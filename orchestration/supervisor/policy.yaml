# sdlc-autopilot policy (README.md describes each rule). A pause that no rule answers escalates to the operator;
# a failed run follows `transient-resume`. A post-merge gate escalates unless `post-merge-allowlist` approves it.
# `limits` bounds every run the supervisor starts.
version: 1
rules:
  # A failed run whose error is one of these transient classes is resumed with `archon workflow resume` after 2, 5
  # and 15 minutes, at most 3 times per run and class, then escalated once. A resume waits while the run's owner
  # process is alive or the host is over the `limits` threshold. A failure older than 60 minutes is escalated, not
  # resumed, and so is every failed run in 1_hrss_pilot or pilot-srv-*.
  - id: transient-resume
    classes: [session-limit, oauth, github-5xx, network, sigterm, first-event-timeout, db-locked]
    backoff_minutes: [2, 5, 15]
    max_age_minutes: 60
  - id: plan-gate
    approve_text: "Approved by sdlc-autopilot policy plan-gate (ready, non-blocking only)."
    open_question_prefix: Non-blocking
  - id: install-gate
    max_retries: 4
  # The factory's PR approval wait (merge_approval: operator) always goes to the operator as a PR card; its «Повернути»
  # asks for a reason and answers reject with it.
  - id: pr-approve
    action: escalate-as-card
  # The factory's QA dev wait (a profile's qa_dev, after a green deploy) goes to the operator as a «На dev готово» card
  # with its screenshots; «Прийнято» moves the Trello card to Ready to Release, «Є зауваження» queues a fix task.
  - id: qa-dev
    action: escalate-as-card
  # A post-merge gate of type approval or manual in `repo` is approved when its step's command block holds exactly one
  # release line and otherwise only these (src/allowlist.ts holds the matcher):
  #   bash scripts/release.sh merge-release-pr v<X.Y.Z>   merges the release PR develop → main with a merge commit
  #   bash scripts/release.sh tag v<X.Y.Z>                annotated tag on that merge commit, pushed to origin
  #   bash scripts/release.sh mirror v<X.Y.Z>             publish-mirror.sh from the tag, dry run then real
  #   bash scripts/release.sh install v<X.Y.Z>            install.sh from the tag, once no factory run is running
  #   bash scripts/release.sh verify v<X.Y.Z>             read-only proofs of the four above
  #   bash scripts/release.sh plugin v<X.Y.Z>             claude plugin update mvp-sdlc for be and fe, then proofs
  #   cd <the run's own worktree>
  #   NAME=value                                          a short local name only (P, M, rc, …), never PATH or GIT_*
  #   read-only: gh pr view|list|checks, gh api (GET only), git fetch|log|rev-parse|show|diff|status, echo, test,
  #              grep, jq, cat
  # Commands split on `;`, `&&`, `||`, `|` and newlines. rm, rmdir, reset, delete, destroy, --delete, -f, -rf, --force,
  # a substitution, a subshell, a glob, a redirection to a file, prose outside the block, a second release line, or a
  # step already approved once in the run escalate. A checkout or mismatch gate always escalates.
  - id: post-merge-allowlist
    repo: OlegShevtsov1/1_mvp_sdlc
    subcommands: [merge-release-pr, tag, mirror, install, verify, plugin]
# Every run the supervisor starts, post-merge and queued briefs alike, waits for a free slot and an idle enough host;
# a transient resume waits for the same host threshold.
limits:
  max_runs: 5
  max_runs_per_repo: 3
  min_mem_available_mb: 800
  max_load1: 8
# A merged PR gets its post-merge run only when GitHub merged it at or after `since` (ISO timestamp with a zone);
# without `since`, at or after the supervisor's first start, kept in ~/.local/state/sdlc-autopilot/state.json.
post_merge:
  since: "2026-11-01T06:00:00Z"
