server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html names the hashed bundle, so browsers must revalidate it to see a new release.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
